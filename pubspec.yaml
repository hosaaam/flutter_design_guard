name: flutter_design_guard
description: Analyzer plugin rules for enforcing Flutter design-system widgets, colors, typography, spacing, and UI standards.
version: 0.1.0-dev.1

repository: https://github.com/hosaaam/flutter_design_guard
issue_tracker: https://github.com/hosaaam/flutter_design_guard/issues

topics:
  - flutter
  - analyzer-plugin
  - static-analysis
  - design-system
  - lints

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  analysis_server_plugin: ^0.3.20
  analyzer: ^14.1.0
  analyzer_plugin: ^0.14.14
  yaml: ^3.1.3

dev_dependencies:
  analyzer_testing: ^0.3.4
  lints: ^6.1.0
  test: ^1.31.2
  test_reflective_loader: ^0.4.0